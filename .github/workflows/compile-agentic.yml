name: Compile Raven Agentic Workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.md'
      - '.gitattributes'
      - '.github/workflows/compile-agentic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raven-agentic-compile
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitHub Agentic Workflows extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-aw --force

      - name: Compile agent workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile --approve

      - name: Stage compiled workflows outside .github
        run: |
          rm -rf generated-locks
          mkdir -p generated-locks
          cp .github/workflows/*.lock.yml generated-locks/
          if [[ -f .github/aw/actions-lock.json ]]; then
            cp .github/aw/actions-lock.json generated-locks/actions-lock.json
          fi

      - name: Commit staged compiler output
        run: |
          if [[ -z "$(git status --porcelain -- generated-locks)" ]]; then
            echo 'No staged compiler changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated-locks
          git commit -m 'Stage compiled Raven agent workflows'
          git push origin HEAD:main
