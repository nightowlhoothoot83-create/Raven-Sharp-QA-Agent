name: Dispatch Raven Site Guardian

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raven-guardian-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current Site Guardian workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run raven-site-guardian.lock.yml --repo "$GITHUB_REPOSITORY" --ref main
